{% extends "base.html" %}
{% block title %}Рассылка — WWGang Admin{% endblock %}
{% block content %}
<h1>📢 Рассылка всем пользователям</h1>

{% if result %}<div class="flash flash-ok">{{ result }}</div>{% endif %}

<div class="card" style="max-width:560px">
<form method="post" action="/broadcast" onsubmit="return confirm('Отправить это сообщение всем пользователям бота?');">
  <label>Текст сообщения</label>
  <textarea name="text" style="min-height:160px" required></textarea>

  <label style="display:flex; align-items:center; gap:8px; margin-top:12px;">
    <input type="checkbox" name="html" style="width:auto" checked>
    <span>Разрешить HTML-разметку (&lt;b&gt;, &lt;i&gt;, ссылки)</span>
  </label>

  <div style="margin-top:20px;">
    <button class="btn" type="submit">📤 Отправить всем</button>
  </div>
</form>
</div>
{% endblock %}
