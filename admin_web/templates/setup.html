<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка — WWGang Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box" style="width:360px">
      <h1>🎴 Первая настройка</h1>
      <p class="muted" style="text-align:center; margin-top:-8px">Создай аккаунт владельца панели</p>
      {% if error %}<div class="flash flash-err">{{ error }}</div>{% endif %}
      <form method="post" action="/setup">
        <label>Логин</label>
        <input name="username" autofocus required>
        <label>Пароль</label>
        <input type="password" name="password" required minlength="6">
        <button class="btn" type="submit" style="width:100%; margin-top:16px;">Создать аккаунт владельца</button>
      </form>
    </div>
  </div>
</body>
</html>
